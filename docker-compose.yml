services:
  backend:
    build: ./backend
    container_name: tecop-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    container_name: tecop-frontend
    ports:
      - "3001:80"
    restart: unless-stopped

  mongo:
    image: mongo:4.4
    container_name: tecop-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
